name = "farmilky-console"
main = "worker/index.ts"
compatibility_date = "2026-10-28"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# API traffic goes through the Worker; everything else is served by Static Assets.
run_worker_first = ["/api/*"]

# Worker-to-Worker binding: no public API hostname or CORS is required.
# The referenced service (farmilky-api) must be deployed to the same account.
[[services]]
binding = "BACKEND"
service = "farmilky-api"
